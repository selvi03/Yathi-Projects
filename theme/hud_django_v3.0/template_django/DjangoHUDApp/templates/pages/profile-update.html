{% extends 'base.html' %}

{% load static %}

{% block title %}Update Profile{% endblock %}

{% block content %}
<style>
    .submit-btn {
        width: 30%;
        background-color: #3cd2a5;
        border-color: #28a745;
        border-radius: 8px; 
        font-size: 18px; 
        padding: 30px; 
        margin-top: 20px; 
        margin-bottom: 1rem;
        display: block;
        margin-left: auto; 
        margin-right: auto;
        color: white; 
        border: none;
    }
    .search-button {
        display: inline-block;
        margin-top: 1rem;
        text-align: center;
    }
    .form-group label {
        font-weight: bold;
        display: inline-block;
        margin-bottom: 0.8rem;
    }
    .form-group input,
    .form-group select {
        width: 100%;
        margin-bottom: 0.6rem;
    }
    .form-group input[type="date"] {
        width: 100%;
    }
    
</style>

<div class="container mt-5">
    <form action="{% url 'DjangoHUDApp:profileupdate' %}" method="POST" name="updateprofile_form" enctype="multipart/form-data">
        {% csrf_token %}
        <h1 class="text-center">Update Profile</h1>

        <!-- Search Section (Email) -->
        <div class="row mt-4">
            <div class="col-md-4 form-group">
                <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                <input type="email" id="email" name="email" class="form-control form-control-lg" placeholder="Enter email to search" value="{{ profile.email|default:'' }}" required >
            </div>
        </div>

        <div class="search-button">
            <button type="submit" name="search" class="btn btn-lg btn-primary" >Search</button>
        </div>

        <!-- Update Section (Details) -->
        <div class="row mt-4">

                    <div class="col-md-4 form-group">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" name="name" class="form-control form-control-lg" value="{{ profile.name|default:'' }}" {% if not profile %}disabled{% endif %}>
                    </div>

                    <div class="col-md-4 form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control form-control-lg" value="{{ profile.password|default:'' }}" {% if not profile %}disabled{% endif %}>
                    </div>


                    <div class="col-md-4 form-group">
                        <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
                        <select id="gender" name="gender" class="form-select form-select-lg" {% if not profile %}disabled{% endif %}>
                            <option value="Male" {% if profile.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if profile.gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if profile.gender == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>

        </div>



        <div class="row mt-4">

                <div class="col-md-4 form-group">
                    <label for="birth_date" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                    <input type="date" id="birth_date" name="birth_date" class="form-control form-control-lg" 
                        value="{{ profile.birth_date|default:'' }}" {% if not profile %}disabled{% endif %}>
                </div>

                <div class="col-md-4 form-group">
                                <label for="mobile_number" class="form-label">Mobile Number <span class="text-danger">*</span></label>
                                <input type="tel" id="mobile_number" name="mobile_number" class="form-control form-control-lg" 
                                    value="{{ profile.mobile_number|default:''  }}" {% if not profile %}disabled{% endif %}>
                </div>

                <div class="col-md-4 form-group">
                    <label for="college_name" class="form-label">College Name <span class="text-danger">*</span></label>
                    <input type="text" id="college_name" name="college_name" class="form-control form-control-lg" 
                        value="{{ profile.college_name|default:''  }}" {% if not profile %}disabled{% endif %}>
                </div>

        </div>



        <div class="row mt-4">

            <div class="col-md-4 form-group">
                <label for="id_number" class="form-label">ID Number <span class="text-danger">*</span></label>
                <input type="text" id="id_number" name="id_number" class="form-control form-control-lg" 
                    value="{{ profile.id_number|default:''  }}" {% if not profile %}disabled{% endif %}>
            </div>

            <div class="col-md-4 form-group">
                <label for="batch_number" class="form-label">Batch Number <span class="text-danger">*</span></label>
                <input type="text" id="batch_number" name="batch_number" class="form-control form-control-lg" 
                    value="{{ profile.batch_number|default:''   }}" {% if not profile %}disabled{% endif %}>
            </div>

            <div class="col-md-4 form-group">
                <label for="city" class="form-label">City <span class="text-danger">*</span></label>
                <input type="text" id="city" name="city" class="form-control form-control-lg" 
                value="{{ profile.city|default:''   }}" {% if not profile %}disabled{% endif %}>
            </div>

        </div>



        <div class="row mt-4">
                <div class="col-md-4 form-group">
                    <label for="address" class="form-label">Address <span class="text-danger">*</span></label>
                    <input type="text" id="address" name="address" class="form-control form-control-lg" 
                        value="{{ profile.address|default:''   }}" {% if not profile %}disabled{% endif %}>
                </div>

                <!-- State Field -->
                <div class="col-md-4 form-group">
                    <label for="state" class="form-label">State <span class="text-danger">*</span></label>
                    <input type="text" id="state" name="state" class="form-control form-control-lg" 
                        value="{{ profile.state|default:''   }}" {% if not profile %}disabled{% endif %}>
                </div>


                <div class="col-md-4 form-group">
                    <label for="country" class="form-label">Country <span class="text-danger">*</span></label>
                    <select id="country" name="country" class="form-select form-select-lg"  {% if not profile %}disabled{% endif %}>
                        <option value="India" {% if profile.country == 'India' %}selected{% endif %}>India</option>
                        <option value="United States" {% if profile.country == 'United States' %}selected{% endif %}>United States</option>
                    </select>
                </div>

        </div>


        <div class="row mt-4">
            <div class="col-md-4 form-group">
                <label for="qualification" class="form-label">Qualification <span class="text-danger">*</span></label>
                <input type="text" id="qualification" name="qualification" class="form-control form-control-lg" 
                    value="{{ profile.qualification|default:''   }}" {% if not profile %}disabled{% endif %}>
            </div>

            <div class="col-md-4 form-group">
                <label for="role" class="form-label">Role <span class="text-danger">*</span></label>
                <select id="role" name="role" class="form-select form-select-lg" {% if not profile %}disabled{% endif %} >
                    <option value="Admin" {% if profile.country == 'Admin' %}selected{% endif %}>Admin</option>
                    <option value="Manager" {% if profile.country == 'Manager' %}selected{% endif %}>Manager</option>
                    <option value="Superadmin" {% if profile.country == 'Superadmin' %}selected{% endif %}>Super Admin</option>
                    <option value="User" {% if profile.country == 'User' %}selected{% endif %}>User</option>
                </select>
            </div>

            <div class="col-md-4 form-group">
                <label for="language" class="form-label">Language <span class="text-danger">*</span></label>
                <select id="language" name="language" class="form-select form-select-lg" {% if not profile %}disabled{% endif %}>
                    <option value="English" {% if profile.language == 'English' %}selected{% endif %}>English</option>
                    <option value="Hindi" {% if profile.language == 'Hindi' %}selected{% endif %}>Hindi</option>
                </select>
            </div>
            
        </div>

        <div class="row mt-4">
            <div class="col-md-4 form-group">
                <label for="skills" class="form-label">Skills<span class="text-danger">*</span></label>
                <select id="skills" name="skills" class="form-select form-select-lg"  {% if not profile %}disabled{% endif %}>
                    <option value="Python" {% if profile.language == 'Python' %}selected{% endif %}>Python</option>
                    <option value="JavaScript" {% if profile.language == 'JavaScript' %}selected{% endif %}>JavaScript</option>
                    <option value="Java" {% if profile.language == 'Java' %}selected{% endif %}>Java</option>

                </select>
            </div>

            <div class="col-md-4 form-group">
                <label for="locations" class="form-label">Preferred Locations <span class="text-danger">*</span></label>
                <input type="text" id="locations" name="locations" class="form-control form-control-lg" 
                    value="{{ profile.locations|default:''   }}" {% if not profile %}disabled{% endif %}>
            </div>

            <div class="col-md-4 form-group">
                <label for="bank_name" class="form-label">Bank Name <span class="text-danger">*</span></label>
                <input type="text" id="bank_name" name="bank_name" class="form-control form-control-lg" 
                    value="{{ profile.bank_name|default:''   }}" {% if not profile %}disabled{% endif %}>
            </div>


        </div>

        <div class="row mt-4">
                    <div class="col-md-4 form-group">
                        <label for="branch_name" class="form-label">Branch Name <span class="text-danger">*</span></label>
                        <input type="text" id="branch_name" name="branch_name" class="form-control form-control-lg" 
                            value="{{ profile.branch_name|default:''   }}" {% if not profile %}disabled{% endif %}>
                    </div>
                    <!-- IFSC Code Field -->
                    <div class="col-md-4 form-group">
                        <label for="ifsc_code" class="form-label">IFSC Code <span class="text-danger">*</span></label>
                        <input type="text" id="ifsc_code" name="ifsc_code" class="form-control form-control-lg" 
                            value="{{ profile.ifsc_code|default:''   }}" {% if not profile %}disabled{% endif %}>
                    </div>

                     <!-- Account Number Field -->
                     <div class="col-md-4 form-group">
                        <label for="account_number" class="form-label">Account Number <span class="text-danger">*</span></label>
                        <input type="text" id="account_number" name="account_number" class="form-control form-control-lg" 
                            value="{{ profile.account_number|default:''   }}" {% if not profile %}disabled{% endif %}>
                    </div>

            
        </div>

        <div class="row mt-4">
             <!-- PAN Number Field -->
                    <div class="col-md-4 form-group">
                        <label for="pan_number" class="form-label">PAN Number <span class="text-danger">*</span></label>
                        <input type="text" id="pan_number" name="pan_number" class="form-control form-control-lg" 
                            value="{{ profile.pan_number|default:''   }}" {% if not profile %}disabled{% endif %}>
                    </div>
                    <!-- GST Number Field -->
                    <div class="col-md-4 form-group">
                        <label for="gst_number" class="form-label">GST Number <span class="text-danger">*</span></label>
                        <input type="text" id="gst_number" name="gst_number" class="form-control form-control-lg" 
                            value="{{ profile.gst_number|default:''   }}" {% if not profile %}disabled{% endif %}>
                    </div>
                    <!-- Photo Field -->
                   <div class="col-md-4 form-group">
                        <label for="photo" class="form-label">Upload Photo</label>
                        <input type="file" id="photo" name="photo" class="form-control form-control-lg"
                        value="{{ profile.photo|default:''   }}" {% if not profile %}disabled{% endif %}>
                    </div> 

        </div>

     <div class="row mt-4">
                    <div class="col-md-4 form-group">
                        <label for="certificate" class="form-label">Upload Certificate</label>
                        <input type="file" id="certificate" name="certificate" class="form-control form-control-lg"
                        value="{{ profile.certificate|default:''   }}" {% if not profile %}disabled{% endif %}>
                    </div>

                    <div class="col-md-4 form-group">
                        <label for="resume" class="form-label">Upload Resume</label>
                        <input type="file" id="resume" name="resume" class="form-control form-control-lg"
                        value="{{ profile.resume|default:''   }}" {% if not profile %}disabled{% endif %}>
                    </div>
            <!-- Ready to Relocate Field -->
                    <div class="col-md-4 form-group">
                        <label for="ready_to_relocate" class="form-label">Ready to Relocate <span class="text-danger">*</span></label>
                        <select id="ready_to_relocate" name="ready_to_relocate" class="form-select form-select-lg"  {% if not profile %}disabled{% endif %}>
                            <option value="Yes" {% if profile.ready_to_relocate == 'Yes' %}selected{% endif %}>Yes</option>
                            <option value="No" {% if profile.ready_to_relocate == 'No' %}selected{% endif %}>No</option>
                        </select>
                    </div>

                   
            

            
        </div>

        <div class="row mt-4">
             <!-- Experience Field -->
             <div class="col-md-4 form-group">
                <label for="experience" class="form-label">Experience (in years) <span class="text-danger">*</span></label>
                <input type="number" id="experience" name="experience" class="form-control form-control-lg" 
                    value="{{ profile.experience|default:''   }}" {% if not profile %}disabled{% endif %}>
            </div>
            

            
        </div> 



        <div class="search-button">
            <button type="submit" name="update_profile" class="btn btn-lg btn-primary" {% if not profile %}disabled{% endif %}>Update Profile</button>
           
        </div>

    </form>
</div>

{% if success %}
    <script>
        // Show success alert without blanking the background
        window.onload = function() {
            alert("Profile updated successfully!");
        };
    </script>
{% endif %}

{% if error %}
    <script>
        // Show error alert without blanking the background
        window.onload = function() {
            alert("{{ error }}");
        };
    </script>
{% endif %}

{% endblock %}
